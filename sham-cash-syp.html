let minimumSyp=0;
(async function(){const storeEl=document.getElementById("sypStoreRate"),minEl=document.getElementById("minimumRate");try{const response=await fetch("/api/exchange-rate?_="+Date.now(),{headers:{"Accept":"application/json"},credentials:"same-origin",cache:"no-store"}),data=await response.json();if(!response.ok||data.status!=="OK"||!data.rate)throw new Error();const buy=Number(data.rate.buy),rate=Number.isFinite(buy)?Math.ceil(buy+11):NaN;if(!Number.isFinite(rate))throw new Error();minimumSyp=rate;const formatted=rate.toLocaleString("en-US");storeEl.textContent=formatted;minEl.textContent=formatted;}catch(error){storeEl.textContent="—";minEl.textContent="—"}})();
async function copyWalletId(){const id=document.getElementById("walletId"),btn=document.getElementById("copyWalletId"),status=document.getElementById("copyStatus");try{await navigator.clipboard.writeText(id.textContent.trim())}catch(e){const range=document.createRange();range.selectNodeContents(id);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);document.execCommand("copy");sel.removeAllRanges()}btn.classList.add("copied");status.style.display="block";setTimeout(function(){btn.classList.remove("copied");status.style.display="none"},1500)}

lance-deposit/sham-syp",{method:"POST",credentials:"same-origin",headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify({amount:value,image_data:imageData,image_mime:file.type,image_name:file.name})});const data=await r.json().catch(()=>({}));if(!r.ok||data.status!=="OK")throw new Error(data.message||"تعذر إرسال الطلب.");showMessage(data.message||"تم إرسال طلب الإيداع بنجاح.","success");submit.textContent="تم الإرسال";form.reset();preview.style.display="none";fileName.textContent="تم إرسال الطلب بنجاح";setTimeout(function(){window.location.reload()},1600)}catch(error){showMessage(error.message||"تعذر إرسال الطلب.","error")}finally{submit.disabled=false}});requireLogin()})();
