<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>الإعدادات - Nabd-Store</title><link rel="stylesheet" href="css/style.css?v=20260927-5"><style>
.settings-page{min-height:100vh;padding:24px 16px;box-sizing:border-box}.settings-card{width:min(620px,100%);margin:0 auto;background:var(--white);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.settings-header{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid var(--border)}.back{width:42px;height:42px;border:0;border-radius:10px;background:var(--primary-light);color:var(--text);font-size:24px;cursor:pointer}.settings-header h1{margin:0;font-size:22px}.settings-list{padding:8px 20px 20px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}.setting-title{font-weight:900;margin-bottom:5px}.setting-desc{font-size:13px;color:var(--muted)}.toggle{position:relative;width:54px;height:30px;flex:0 0 54px}.toggle input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#333;border-radius:30px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:24px;height:24px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.toggle input:checked+.slider{background:var(--primary)}.toggle input:checked+.slider:before{transform:translateX(-24px)}.logout-btn{width:100%;min-height:48px;margin-top:12px;border:1px solid rgba(239,68,68,.45);border-radius:12px;background:rgba(239,68,68,.10);color:#ef4444;font:inherit;font-weight:900;cursor:pointer}.logout-btn:active{transform:scale(.98)}
</style></head><body><main class="settings-page"><section class="settings-card"><header class="settings-header"><button class="back" type="button" onclick="location.href='/'">→</button><div><h1>الإعدادات</h1><div class="setting-desc">تحكم في مظهر الموقع</div></header><div class="settings-list"><div class="setting-row"><div><div class="setting-title">🌙 الوضع الليلي</div><div class="setting-desc">عند التفعيل تصبح واجهة الموقع سوداء وذهبية، وعند الإيقاف تصبح بيضاء وذهبية.</div></div><label class="toggle"><input id="nightMode" type="checkbox"><span class="slider"></span></label></div><button class="logout-btn" id="logoutBtn" type="button">تسجيل الخروج</button></div></section></main><script>
(function(){const root=document.documentElement,toggle=document.getElementById("nightMode"),saved=localStorage.getItem("nabd-theme")||"dark";root.dataset.theme=saved;toggle.checked=saved==="dark";toggle.addEventListener("change",function(){const next=toggle.checked?"dark":"light";root.dataset.theme=next;localStorage.setItem("nabd-theme",next);});document.getElementById("logoutBtn").addEventListener("click",async function(){const btn=this;btn.disabled=true;btn.textContent="جاري تسجيل الخروج...";try{const r=await fetch("/api/customer/logout",{method:"POST",headers:{Accept:"application/json"},credentials:"same-origin"});if(!r.ok) throw new Error();localStorage.removeItem("nabd-theme");location.href="/";}catch(e){btn.disabled=false;btn.textContent="تسجيل الخروج";alert("تعذر تسجيل الخروج، حاول مرة أخرى.");}});})();
</script></body></html>
