<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>الإعدادات - Nabd-Store</title><link rel="stylesheet" href="css/style.css"><style>
.settings-page{min-height:100vh;padding:24px 16px;box-sizing:border-box}.settings-card{width:min(620px,100%);margin:0 auto;background:var(--white);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.settings-header{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid var(--border)}.back{width:42px;height:42px;border:0;border-radius:10px;background:var(--primary-light);color:var(--text);font-size:24px;cursor:pointer}.settings-header h1{margin:0;font-size:22px}.settings-list{padding:8px 20px 20px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}.setting-title{font-weight:900;margin-bottom:5px}.setting-desc{font-size:13px;color:var(--muted)}.toggle{position:relative;width:54px;height:30px;flex:0 0 54px}.toggle input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#333;border-radius:30px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:24px;height:24px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.toggle input:checked+.slider{background:var(--primary)}.toggle input:checked+.slider:before{transform:translateX(-24px)}
</style></head><body><main class="settings-page"><section class="settings-card"><header class="settings-header"><button class="back" type="button" onclick="location.href='/'">→</button><div><h1>الإعدادات</h1><div class="setting-desc">تحكم في مظهر الموقع</div></div></header><div class="settings-list"><div class="setting-row"><div><div class="setting-title">🌙 الوضع الليلي</div><div class="setting-desc">تشغيله يجعل الموقع أبيض وذهبي، وإيقافه يجعله أسود وذهبي.</div></div><label class="toggle"><input id="nightMode" type="checkbox"><span class="slider"></span></label></div></div></section></main><script>
(function(){const root=document.documentElement,toggle=document.getElementById("nightMode"),saved=localStorage.getItem("nabd-theme")||"dark";root.dataset.theme=saved;toggle.checked=saved==="light";toggle.addEventListener("change",function(){const next=toggle.checked?"light":"dark";root.dataset.theme=next;localStorage.setItem("nabd-theme",next);});})();
</script></body></html>
