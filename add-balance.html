<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختر طريقة الدفع - Nabd-Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif}
.page{width:min(920px,94vw);margin:0 auto;padding:22px 0 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:34px}
.back{width:44px;height:44px;border-radius:14px;background:#151515;border:1px solid #292929;color:#fff;font-size:24px;text-decoration:none;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:clamp(24px,5vw,34px);font-weight:900}
.subtitle{text-align:center;color:#aaa;margin:0 0 24px;font-size:15px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;padding:3px 2px}
.method{width:100%;aspect-ratio:1/1;border:2px solid #f5c400;border-radius:17px;background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;overflow:hidden;text-decoration:none;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.05);transition:.2s}
.method:hover{border-color:#f5c400;color:#f5c400;transform:translateY(-2px);box-shadow:0 4px 16px rgba(245,196,0,.16)}
.method:active{transform:scale(.97)}
.icon{width:88%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:42px;margin:auto}.method-logo{width:100%;height:100%;object-fit:contain;display:block;border-radius:12px}
.name{width:100%;text-align:center;font-size:14px;font-weight:900;padding:8px 3px 4px}
.note{display:none}
@media(max-width:560px){.methods{grid-template-columns:repeat(3,1fr);gap:8px}.method{border-radius:15px;padding:8px}.name{font-size:12px;padding:7px 2px 3px}.icon{font-size:32px}}
.syp-rate-card{margin:0 0 22px;padding:16px;border:1px solid #292929;border-radius:18px;background:#111;text-align:center}.syp-rate-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.syp-rate-label{font-size:12px;color:#aaa}.syp-rate-card h2{margin:4px 0 0;font-size:18px}.syp-rate-source{font-size:11px;color:#aaa}.syp-rate-values{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:14px}.syp-rate-value{display:flex;flex-direction:column;gap:3px}.syp-rate-value span{font-size:12px;color:#aaa}.syp-rate-value strong{font-size:22px}.syp-rate-value small{font-size:11px;color:#888}.syp-rate-plus{font-size:18px;font-weight:900;color:#f5c400}.syp-rate-meta{margin-top:12px;font-size:11px;color:#888}@media(max-width:560px){.syp-rate-values{gap:6px}.syp-rate-value strong{font-size:18px}.syp-rate-card h2{font-size:16px}}</style>
</head>
<body>
<main class="page">
<header class="top">
<a class="back" href="/" aria-label="العودة">‹</a>
<h1>اختر طريقة الدفع</h1>
</header>
<p class="subtitle">اختر طريقة إدخال الرصيد التي تريد استخدامها</p>
<section class="syp-rate-card" id="sypRateCard" aria-label="سعر صرف الليرة السورية">
  <div class="syp-rate-card-head">
    <div>
      <span class="syp-rate-label">سعر الصرف</span>
      <h2>الدولار مقابل الليرة السورية</h2>
    </div>
    <span class="syp-rate-source">LiraScope</span>
  </div>
  <div class="syp-rate-values">
    <div class="syp-rate-value">
      <span>سعر الشراء</span>
      <strong id="sypSourceRate">—</strong>
      <small>ل.س / $</small>
    </div>
    <div class="syp-rate-plus" aria-hidden="true">+10</div>
    <div class="syp-rate-value syp-rate-final">
      <span>السعر المعتمد في نبض ستور</span>
      <strong id="sypStoreRate">—</strong>
      <small>ل.س / $</small>
    </div>
  </div>
  <div class="syp-rate-meta" id="sypRateMeta">جاري تحديث سعر الصرف...</div>
</section>
<section class="methods" aria-label="طرق الدفع">
<a class="method" href="/sham-cash-dollar.html" data-method="sham-dollar"><span class="icon"><img class="method-logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Image_of_the_Sham_Cash_app_in_Syria_2026.jpg" alt="شعار شام كاش"></span><span class="name">شام كاش دولار</span></a>
<a class="method" href="#" data-method="sham-syp"><span class="icon"><img class="method-logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Image_of_the_Sham_Cash_app_in_Syria_2026.jpg" alt="شعار شام كاش"></span><span class="name">شام كاش سوري</span></a>
<a class="method" href="#" data-method="binance"><span class="icon"><img class="method-logo" src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Binance_Logo.svg" alt="شعار باينانس الرسمي"></span><span class="name">باينانس</span></a>
<a class="method" href="#" data-method="syriatel"><span class="icon">📱</span><span class="name">سيرياتيل كاش</span></a>
</section>
</main>
<script>
document.querySelectorAll("[data-method]").forEach(function(card){
 card.addEventListener("click",function(e){
   if(card.getAttribute("data-method") !== "sham-dollar") e.preventDefault();
 });
});
</script>
<script>
(async function(){
  const sourceEl=document.getElementById("sypSourceRate");
  const storeEl=document.getElementById("sypStoreRate");
  const metaEl=document.getElementById("sypRateMeta");
  if(!sourceEl||!storeEl||!metaEl)return;
  sourceEl.textContent="جاري التحديث...";
  storeEl.textContent="جاري التحديث...";
  try{
    const response=await fetch("/api/exchange-rate?_="+Date.now(),{headers:{"Accept":"application/json"},credentials:"same-origin",cache:"no-store"});
    const data=await response.json();
    if(!response.ok||data.status!=="OK"||!data.rate)throw new Error(data.message||"تعذر تحديث سعر الصرف.");
    const buy=Number(data.rate.buy),rate=Number(data.rate.rate);
    sourceEl.textContent=Number.isFinite(buy)?buy.toLocaleString("ar-SY"):"—";
    storeEl.textContent=Number.isFinite(rate)?rate.toLocaleString("ar-SY"):"—";
    metaEl.textContent="آخر تحديث: "+new Date().toLocaleTimeString("ar-SY",{hour:"2-digit",minute:"2-digit"});
  }catch(error){
    sourceEl.textContent="—"; storeEl.textContent="—"; metaEl.textContent="تعذر تحديث سعر الصرف حاليًا.";
  }
})();
</script></body>
</html>
