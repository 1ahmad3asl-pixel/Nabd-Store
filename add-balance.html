<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختر طريقة الدفع - Nabd-Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif}
.page{width:min(920px,94vw);margin:0 auto;padding:22px 0 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:34px}
.back{width:44px;height:44px;border-radius:14px;background:#151515;border:1px solid #292929;color:#fff;font-size:24px;text-decoration:none;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:clamp(24px,5vw,34px);font-weight:900}
.subtitle{text-align:center;color:#aaa;margin:0 0 24px;font-size:15px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;margin-bottom:20px;padding:3px 2px}
.method-wrap{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.method{width:100%;aspect-ratio:1/1;border:2px solid #f5c400;border-radius:17px;background:#141414;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;text-decoration:none;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.05);transition:.2s}
.method:hover{border-color:#f5c400;color:#f5c400;transform:translateY(-2px);box-shadow:0 4px 16px rgba(245,196,0,.16)}
.method:active{transform:scale(.97)}
.icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px}
.method-logo{width:100%;height:100%;object-fit:contain;display:block;border-radius:15px}
.method-name{width:100%;text-align:center;font-size:14px;font-weight:900;color:#fff;line-height:1.35}
.note{display:none}
@media(max-width:560px){.methods{grid-template-columns:repeat(3,1fr);gap:14px 8px}.method{border-radius:15px}.method-logo{border-radius:13px}.method-name{font-size:12px}.icon{font-size:32px}}
</style>
</head>
<body>
<main class="page">
<header class="top">
<a class="back" href="/" aria-label="العودة">‹</a>
<h1>اختر طريقة الدفع</h1>
</header>
<p class="subtitle">اختر طريقة إدخال الرصيد التي تريد استخدامها</p>
<section class="methods" aria-label="طرق الدفع">
<div class="method-wrap"><a class="method" href="/sham-cash-dollar.html" data-method="sham-dollar"><span class="icon"><img class="method-logo" src="/public/assets/payment/sham-cash.svg" alt="شعار شام كاش"></span></a><span class="method-name">شام كاش دولار</span></div>
<div class="method-wrap"><a class="method" href="/sham-cash-syp.html" data-method="sham-syp"><span class="icon"><img class="method-logo" src="/public/assets/payment/sham-cash.svg" alt="شعار شام كاش"></span></a><span class="method-name">شام كاش سوري</span></div>
<div class="method-wrap"><a class="method" href="/binance.html" data-method="binance"><span class="icon"><img class="method-logo" src="/public/assets/payment/binance.svg" alt="شعار باينانس الرسمي من Google Play"></span></a><span class="method-name">باينانس</span></div>
<div class="method-wrap"><a class="method" href="#" data-method="syriatel"><span class="icon"><img class="method-logo" src="/public/assets/payment/syriatel-cash.svg" alt="شعار سيريتل كاش الرسمي"></span></a><span class="method-name">سيرياتيل كاش</span></div>
</section>
</main>
<script>
document.querySelectorAll("[data-method]").forEach(function(card){
 card.addEventListener("click",function(e){
   if(card.getAttribute("data-method") === "syriatel") e.preventDefault();
 });
});
</script>
</body>
</html>
