<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
(function requireTermsConsent(){
  try{if(localStorage.getItem("nabd_terms_accepted_v1")==="1")return;}catch(_){}
  const next=location.pathname+location.search;
  location.replace("/terms.html?next="+encodeURIComponent(next));
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب العميل - Nabd-Store</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* منع تحديد النص وقائمة النسخ/الاستدعاء المطولة في صفحة المصادقة فقط */
html,body,body *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:grid;place-items:center;background:var(--background);color:var(--text);padding:20px}
.auth-card{width:min(430px,100%);text-align:center}
.account-icon{font-size:46px;margin-bottom:8px}.auth-card h1{margin:0 0 6px;font-size:28px}
.store-name{margin:0 0 26px;color:var(--primary);font-family:"Dubai Medium","Dubai",Tahoma,Arial,sans-serif;font-size:22px}
.auth-form{text-align:right}.auth-form label{display:block;font-weight:700;margin:14px 0 7px}
.auth-form input{width:100%;box-sizing:border-box;padding:14px;border:1px solid var(--border);background:var(--white);color:var(--text);border-radius:11px;font-size:16px}
.email-verified-message{margin-top:8px;color:#16803d;font-size:14px;font-weight:800;text-align:right}.email-verify-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.email-verify-row button,.code-row button{padding:12px 14px;border:0;border-radius:10px;background:#f5c400;color:#111;font-weight:800;cursor:pointer;white-space:nowrap}.email-verify-row button:disabled,.code-row button:disabled{opacity:.55;cursor:not-allowed}.code-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.password-row{position:relative}.password-row input{padding-left:50px}
.password-toggle{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.auth-actions button{padding:13px;border:0;border-radius:11px;cursor:pointer;font-size:16px;font-weight:700}
.login-btn{background:linear-gradient(135deg,#f5c400,#c99f00);color:#111}
.register-btn{background:transparent;color:var(--primary);border:1px solid var(--primary)!important}
.google-login,.guest-login{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;margin-top:12px;padding:13px;text-align:center;border:1px solid var(--border);border-radius:11px;text-decoration:none;color:var(--text);font-weight:700;background:var(--white);font:inherit;cursor:pointer;min-height:50px}.google-login{margin-top:12px}.google-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;box-sizing:border-box;border-radius:5px;background:transparent;flex:0 0 28px}.google-mark img{display:block;width:24px;height:24px;object-fit:contain}.guest-login{margin-top:10px;background:transparent;color:var(--text)}
.register-return{margin-top:18px;text-align:center;color:var(--text);font-size:15px}.register-return button{display:block;width:100%;margin-top:9px;min-height:48px;padding:12px;border:1px solid var(--primary);border-radius:11px;background:transparent;color:var(--primary);font:inherit;font-weight:800;cursor:pointer}
[hidden]{display:none!important}
.auth-error{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#ffe8e8;color:#a00;text-align:center}
</style>
</head>
<body>
<main class="auth-card">
<div class="account-icon">👤</div>
<h1>حسابي</h1>
<div class="store-name">Nabd-Store</div>
<form id="authForm" class="auth-form">
<div id="nameField" hidden><label for="name">الاسم</label><input id="name" type="text" autocomplete="name"></div>
<label for="email">البريد الإلكتروني</label>
<div class="email-verify-row"><input id="email" type="email" autocomplete="email" required><button id="sendCodeBtn" type="button" hidden>تحقق</button></div>\n<div id="emailVerifiedMessage" class="email-verified-message" role="status" aria-live="polite" hidden>✓ تم التحقق من البريد الإلكتروني</div>
<div id="codeSection" hidden><label for="verificationCode">رمز التحقق</label><div class="code-row"><input id="verificationCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="verifyCodeBtn" type="button">تأكيد الرمز</button></div></div>
<div id="passwordSection" hidden><label for="password">كلمة المرور</label><div class="password-row"><input id="password" type="password" minlength="8" autocomplete="current-password" required><button class="password-toggle" id="passwordToggle" type="button">عرض</button></div></div>
<div class="auth-actions"><button id="loginBtn" class="login-btn" type="submit">تسجيل الدخول</button><button id="registerBtn" class="register-btn" type="button">إنشاء حساب</button></div>
<a class="google-login" href="/api/customer/google"><span class="google-mark" aria-hidden="true"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt=""></span><span>تسجيل الدخول باستخدام Google</span></a>
<button class="guest-login" id="guestLoginBtn" type="button">المتابعة كضيف</button>
<div class="register-return" id="registerReturn" hidden><div>هل لديك حساب؟</div><button id="returnLoginBtn" type="button">العودة لتسجيل الدخول</button></div>
<div id="authError" class="auth-error"></div>
</form>
</main>
<script>
(async function redirectAlreadyLoggedInCustomer(){
  try{
    const r=await fetch("/api/customer/auth/me",{headers:{"Accept":"application/json"},credentials:"same-origin",cache:"no-store"});
    if(!r.ok) return;
    const data=await r.json();
    if(data && data.customer) location.replace("/");
  }catch(_){}
})();
let mode="login",emailVerified=false,verificationToken="";
const form=document.getElementById("authForm"),googleLogin=document.querySelector(".google-login"),guestLoginBtn=document.getElementById("guestLoginBtn"),registerReturn=document.getElementById("registerReturn"),returnLoginBtn=document.getElementById("returnLoginBtn"),nameField=document.getElementById("nameField"),loginBtn=document.getElementById("loginBtn"),registerBtn=document.getElementById("registerBtn"),password=document.getElementById("password"),passwordToggle=document.getElementById("passwordToggle"),error=document.getElementById("authError"),email=document.getElementById("email"),sendCodeBtn=document.getElementById("sendCodeBtn"),codeSection=document.getElementById("codeSection"),verificationCode=document.getElementById("verificationCode"),verifyCodeBtn=document.getElementById("verifyCodeBtn"),passwordSection=document.getElementById("passwordSection"),emailVerifiedMessage=document.getElementById("emailVerifiedMessage");
function showError(message,ok=false){error.textContent=message;error.style.display="block";error.style.background=ok?"#e8f7ee":"#ffe8e8";error.style.color=ok?"#176b3a":"#a00";}
function setMode(next){mode=next;nameField.hidden=true;loginBtn.textContent=mode==="login"?"تسجيل الدخول":"تسجيل الحساب";registerBtn.textContent="إنشاء حساب";registerBtn.hidden=mode==="register";googleLogin.hidden=mode==="register";guestLoginBtn.hidden=mode==="register";registerReturn.hidden=mode!=="register";error.style.display="none";document.getElementById("name").required=false;email.required=true;sendCodeBtn.hidden=mode!=="register";codeSection.hidden=true;emailVerifiedMessage.hidden=true;emailVerified=false;verificationToken="";passwordSection.hidden=mode==="register";password.required=mode==="login";password.value="";loginBtn.hidden=mode==="register";}
registerBtn.onclick=()=>setMode("register");
returnLoginBtn.onclick=()=>setMode("login");
passwordToggle.onclick=()=>{const visible=password.type==="text";password.type=visible?"password":"text";passwordToggle.textContent=visible?"عرض":"إخفاء";};
email.addEventListener("input",()=>{if(mode==="register"){emailVerifiedMessage.hidden=true;emailVerified=false;verificationToken="";codeSection.hidden=true;passwordSection.hidden=true;loginBtn.hidden=true;nameField.hidden=true;}});
sendCodeBtn.onclick=async()=>{error.style.display="none";const value=email.value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(value)){showError("أدخل بريدًا إلكترونيًا صحيحًا أولًا.");return;}sendCodeBtn.disabled=true;try{const r=await fetch("/api/customer/email/send-code",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:value})});const data=await r.json();if(!r.ok)throw new Error(data.message||"تعذر إرسال رمز التحقق.");codeSection.hidden=false;verificationCode.focus();showError("تم إرسال رمز التحقق إلى بريدك الإلكتروني.",true);}catch(err){showError(err.message);}finally{sendCodeBtn.disabled=false;}};
verifyCodeBtn.onclick=async()=>{error.style.display="none";const value=email.value.trim().toLowerCase(),code=verificationCode.value.trim();if(!/^\d{6}$/.test(code)){showError("أدخل رمز التحقق المكوّن من 6 أرقام.");return;}verifyCodeBtn.disabled=true;try{const r=await fetch("/api/customer/email/verify-code",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:value,code})});const data=await r.json();if(!r.ok)throw new Error(data.message||"تعذر التحقق من الرمز.");emailVerified=true;verificationToken=String(data.verification_token||"");emailVerifiedMessage.hidden=false;codeSection.hidden=true;sendCodeBtn.hidden=true;nameField.hidden=false;document.getElementById("name").required=true;passwordSection.hidden=false;password.required=true;loginBtn.hidden=false;password.focus();error.style.display="none";}catch(err){showError(err.message);}finally{verifyCodeBtn.disabled=false;}};
form.addEventListener("submit",async e=>{e.preventDefault();error.style.display="none";if(mode==="register"&&!emailVerified){showError("تحقق من بريدك الإلكتروني أولًا.");return;}loginBtn.disabled=true;registerBtn.disabled=true;try{const body={email:email.value.trim(),password:password.value};if(mode==="register"){body.name=document.getElementById("name").value.trim();body.verification_token=verificationToken;}const r=await fetch("/api/customer/"+(mode==="login"?"login":"register"),{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.message||"تعذر إكمال العملية.");location.href="/";}catch(err){showError(err.message);}finally{loginBtn.disabled=false;registerBtn.disabled=false;}});
 document.getElementById("guestLoginBtn").addEventListener("click",()=>{try{sessionStorage.setItem("nabd_guest_mode","1");}catch(_){}location.href="/";});
const params=new URLSearchParams(location.search);
setMode(params.get("mode")==="register"?"register":"login");
</script>
<script>
(function lockTextSelection(){
  const block=e=>e.preventDefault();
  document.addEventListener("contextmenu",block,{capture:true});
  document.addEventListener("selectstart",block,{capture:true});
  document.addEventListener("copy",block,{capture:true});
  document.addEventListener("cut",block,{capture:true});
  document.addEventListener("dragstart",block,{capture:true});
})();
</script>
<script src="/js/click-sound.js"></script>
</body>
</html>
