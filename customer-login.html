<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب العميل - Nabd-Store</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:var(--background);color:var(--text);padding:20px}
.auth-card{width:min(430px,100%);text-align:center}
.account-icon{font-size:46px;margin-bottom:8px}.auth-card h1{margin:0 0 6px;font-size:28px}
.store-name{margin:0 0 26px;color:var(--primary);font-family:"Dubai Medium","Dubai",Tahoma,Arial,sans-serif;font-size:22px}
.auth-form{text-align:right}.auth-form label{display:block;font-weight:700;margin:14px 0 7px}
.auth-form input{width:100%;box-sizing:border-box;padding:14px;border:1px solid var(--border);background:var(--white);color:var(--text);border-radius:11px;font-size:16px}
.email-verify-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.email-verify-row button,.code-row button{padding:12px 14px;border:0;border-radius:10px;background:#f5c400;color:#111;font-weight:800;cursor:pointer;white-space:nowrap}.email-verify-row button:disabled,.code-row button:disabled{opacity:.55;cursor:not-allowed}.code-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.verified-badge{display:inline-flex;align-items:center;gap:5px;margin-top:7px;color:#198754;font-weight:700;font-size:13px}
.password-row{position:relative}.password-row input{padding-left:50px}
.password-toggle{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.auth-actions button{padding:13px;border:0;border-radius:11px;cursor:pointer;font-size:16px;font-weight:700}
.login-btn{background:linear-gradient(135deg,#f5c400,#c99f00);color:#111}
.register-btn{background:transparent;color:var(--primary);border:1px solid var(--primary)!important}
.google-login{display:block;margin-top:12px;padding:13px;text-align:center;border:1px solid var(--border);border-radius:11px;text-decoration:none;color:var(--text);font-weight:700;background:var(--white)}
.auth-error{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#ffe8e8;color:#a00;text-align:center}
</style>
</head>
<body>
<main class="auth-card">
<div class="account-icon">👤</div>
<h1>حسابي</h1>
<div class="store-name">Nabd-Store</div>
<form id="authForm" class="auth-form">
<div id="nameField" hidden><label for="name">الاسم</label><input id="name" type="text" autocomplete="name"></div>
<label for="email">البريد الإلكتروني</label>
<div class="email-verify-row"><input id="email" type="email" autocomplete="email" required><button id="sendCodeBtn" type="button" hidden>تحقق</button></div>
<div id="codeSection" hidden><label for="verificationCode">رمز التحقق</label><div class="code-row"><input id="verificationCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="verifyCodeBtn" type="button">تأكيد الرمز</button></div></div>
<div id="verifiedBadge" class="verified-badge" hidden>✓ تم التحقق من البريد الإلكتروني</div>
<div id="passwordSection" hidden><label for="password">كلمة المرور</label><div class="password-row"><input id="password" type="password" minlength="8" autocomplete="current-password" required><button class="password-toggle" id="passwordToggle" type="button">عرض</button></div></div>
<div class="auth-actions"><button id="loginBtn" class="login-btn" type="submit">تسجيل الدخول</button><button id="registerBtn" class="register-btn" type="button">إنشاء حساب</button></div>
<a class="google-login" href="/api/customer/google">تسجيل الدخول باستخدام Google</a>
<div id="authError" class="auth-error"></div>
</form>
</main>
<script>
(async function redirectAlreadyLoggedInCustomer(){
  try{
    const r=await fetch("/api/customer/auth/me",{headers:{"Accept":"application/json"},credentials:"same-origin",cache:"no-store"});
    if(!r.ok) return;
    const data=await r.json();
    if(data && data.customer) location.replace("/customer-profile.html");
  }catch(_){}
})();
let mode="login",emailVerified=false,verificationToken="";
const form=document.getElementById("authForm"),nameField=document.getElementById("nameField"),loginBtn=document.getElementById("loginBtn"),registerBtn=document.getElementById("registerBtn"),password=document.getElementById("password"),passwordToggle=document.getElementById("passwordToggle"),error=document.getElementById("authError"),email=document.getElementById("email"),sendCodeBtn=document.getElementById("sendCodeBtn"),codeSection=document.getElementById("codeSection"),verificationCode=document.getElementById("verificationCode"),verifyCodeBtn=document.getElementById("verifyCodeBtn"),verifiedBadge=document.getElementById("verifiedBadge"),passwordSection=document.getElementById("passwordSection");
function showError(message,ok=false){error.textContent=message;error.style.display="block";error.style.background=ok?"#e8f7ee":"#ffe8e8";error.style.color=ok?"#176b3a":"#a00";}
function setMode(next){mode=next;nameField.hidden=true;loginBtn.textContent=mode==="login"?"تسجيل الدخول":"تسجيل الحساب";registerBtn.textContent=mode==="login"?"إنشاء حساب":"العودة لتسجيل الدخول";error.style.display="none";document.getElementById("name").required=false;email.required=true;sendCodeBtn.hidden=mode!=="register";codeSection.hidden=true;verifiedBadge.hidden=true;emailVerified=false;verificationToken="";passwordSection.hidden=mode==="register";password.required=mode==="login";password.value="";loginBtn.hidden=mode==="register";}
registerBtn.onclick=()=>setMode(mode==="login"?"register":"login");
passwordToggle.onclick=()=>{const visible=password.type==="text";password.type=visible?"password":"text";passwordToggle.textContent=visible?"عرض":"إخفاء";};
email.addEventListener("input",()=>{if(mode==="register"){emailVerified=false;verificationToken="";codeSection.hidden=true;verifiedBadge.hidden=true;passwordSection.hidden=true;loginBtn.hidden=true;nameField.hidden=true;}});
sendCodeBtn.onclick=async()=>{error.style.display="none";const value=email.value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(value)){showError("أدخل بريدًا إلكترونيًا صحيحًا أولًا.");return;}sendCodeBtn.disabled=true;try{const r=await fetch("/api/customer/email/send-code",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:value})});const data=await r.json();if(!r.ok)throw new Error(data.message||"تعذر إرسال رمز التحقق.");codeSection.hidden=false;verificationCode.focus();showError("تم إرسال رمز التحقق إلى بريدك الإلكتروني.",true);}catch(err){showError(err.message);}finally{sendCodeBtn.disabled=false;}};
verifyCodeBtn.onclick=async()=>{error.style.display="none";const value=email.value.trim().toLowerCase(),code=verificationCode.value.trim();if(!/^\d{6}$/.test(code)){showError("أدخل رمز التحقق المكوّن من 6 أرقام.");return;}verifyCodeBtn.disabled=true;try{const r=await fetch("/api/customer/email/verify-code",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:value,code})});const data=await r.json();if(!r.ok)throw new Error(data.message||"تعذر التحقق من الرمز.");emailVerified=true;verificationToken=String(data.verification_token||"");codeSection.hidden=true;verifiedBadge.hidden=false;sendCodeBtn.hidden=true;nameField.hidden=false;document.getElementById("name").required=true;passwordSection.hidden=false;password.required=true;loginBtn.hidden=false;password.focus();showError("تم التحقق من البريد بنجاح. الآن أدخل اسمك وكلمة المرور لإكمال إنشاء الحساب.",true);}catch(err){showError(err.message);}finally{verifyCodeBtn.disabled=false;}};
form.addEventListener("submit",async e=>{e.preventDefault();error.style.display="none";if(mode==="register"&&!emailVerified){showError("تحقق من بريدك الإلكتروني أولًا.");return;}loginBtn.disabled=true;registerBtn.disabled=true;try{const body={email:email.value.trim(),password:password.value};if(mode==="register"){body.name=document.getElementById("name").value.trim();body.verification_token=verificationToken;}const r=await fetch("/api/customer/"+(mode==="login"?"login":"register"),{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.message||"تعذر إكمال العملية.");location.href=mode==="register"?"/customer-profile.html?new=1":"/customer-profile.html";}catch(err){showError(err.message);}finally{loginBtn.disabled=false;registerBtn.disabled=false;}});
const params=new URLSearchParams(location.search);
setMode(params.get("mode")==="register"?"register":"login");
</script>
</body>
</html>
