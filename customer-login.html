<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="/js/csp-inline/customer-login-1.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب العميل - Nabd-Store</title>
<link rel="stylesheet" href="css/style.css?v=20261019-cache1">
<style>
/* منع تحديد النص وقائمة النسخ/الاستدعاء المطولة في صفحة المصادقة فقط */
html,body,body *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:grid;place-items:center;background:var(--background);color:var(--text);padding:20px}
.auth-card{width:min(430px,100%);text-align:center}
.account-icon{font-size:46px;margin-bottom:8px}.auth-card h1{margin:0 0 6px;font-size:28px}
.store-name{margin:0 0 26px;color:var(--primary);font-family:"Dubai Medium","Dubai",Tahoma,Arial,sans-serif;font-size:22px}.store-name.auth-note{font-size:14px;line-height:1.9;font-weight:600;color:var(--text);max-width:390px;margin:0 auto 26px}
.auth-form{text-align:right}.auth-form label{display:block;font-weight:700;margin:14px 0 7px}
.auth-form input{width:100%;box-sizing:border-box;padding:14px;border:1px solid var(--border);background:var(--white);color:var(--text);border-radius:11px;font-size:16px}
.email-verified-message{margin-top:8px;color:#16803d;font-size:14px;font-weight:800;text-align:right}.email-verify-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.email-verify-row button,.code-row button{padding:12px 14px;border:0;border-radius:10px;background:#f5c400;color:#111;font-weight:800;cursor:pointer;white-space:nowrap}.email-verify-row button:disabled,.code-row button:disabled{opacity:.55;cursor:not-allowed}.code-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.password-row{position:relative}.password-row input{padding-left:50px}
.password-toggle{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}.forgot-password-note{margin-top:8px;text-align:right;font-size:12px;line-height:1.8;color:var(--muted)}.forgot-password-note a{color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.auth-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
.auth-actions button{padding:13px;border:0;border-radius:11px;cursor:pointer;font-size:16px;font-weight:700}
.login-btn{background:linear-gradient(135deg,#f5c400,#c99f00);color:#111}
.register-btn{background:transparent;color:var(--primary);border:1px solid var(--primary)!important}
.google-login{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;margin-top:12px;padding:13px;text-align:center;border:1px solid var(--border);border-radius:11px;text-decoration:none;color:var(--text);font-weight:700;background:var(--white);font:inherit;cursor:pointer;min-height:50px}.google-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;box-sizing:border-box;border-radius:5px;background:transparent;flex:0 0 28px}.google-mark img{display:block;width:24px;height:24px;object-fit:contain}
.signup-prompt{margin-top:18px;text-align:center;color:var(--text);font-size:15px}.signup-prompt .register-btn{display:block;width:100%;box-sizing:border-box;margin-top:9px;min-height:48px;padding:12px;border:1px solid var(--primary);border-radius:11px;background:transparent;color:var(--primary);font:inherit;font-weight:800;cursor:pointer}.register-return{margin-top:18px;text-align:center;color:var(--text);font-size:15px}.register-return button{display:block;width:100%;margin-top:9px;min-height:48px;padding:12px;border:1px solid var(--primary);border-radius:11px;background:transparent;color:var(--primary);font:inherit;font-weight:800;cursor:pointer}
[hidden]{display:none!important}
.auth-error{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#ffe8e8;color:#a00;text-align:center}
</style>
</head>
<body>
<main class="auth-card">
<div class="account-icon">👤</div>
<h1 id="authTitle">حسابي</h1>
<div class="store-name" id="authSubtitle">Nabd-Store</div>
<form id="authForm" class="auth-form">
<div id="nameField" hidden><label for="name">الاسم</label><input id="name" type="text" autocomplete="name"></div>
<label for="email">البريد الإلكتروني</label>
<div class="email-verify-row"><input id="email" type="email" autocomplete="email" required><button id="sendCodeBtn" type="button" hidden>تحقق</button></div>
<div id="emailVerifiedMessage" class="email-verified-message" role="status" aria-live="polite" hidden>✓ تم التحقق من البريد الإلكتروني</div>
<div id="codeSection" hidden><label for="verificationCode">رمز التحقق</label><div class="code-row"><input id="verificationCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="verifyCodeBtn" type="button">تأكيد الرمز</button></div></div>
<div id="passwordSection" hidden><label for="password">كلمة المرور</label><div class="password-row"><input id="password" type="password" minlength="8" autocomplete="current-password" required><button class="password-toggle" id="passwordToggle" type="button">عرض</button></div></div>
<div id="forgotPasswordNote" class="forgot-password-note">هل نسيت كلمة المرور؟ <a href="https://wa.me/994405694104" target="_blank" rel="noopener noreferrer">تواصل معنا</a></div>
<div class="auth-actions"><button id="loginBtn" class="login-btn" type="submit">تسجيل الدخول</button></div>
<a class="google-login" href="/api/customer/google"><span class="google-mark" aria-hidden="true"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt=""></span><span>تسجيل الدخول باستخدام Google</span></a>
<div class="signup-prompt" id="signupPrompt"><div>ليس لديك حساب؟</div><button id="registerBtn" class="register-btn" type="button">إنشاء حساب</button></div>
<div class="register-return" id="registerReturn" hidden><div>هل لديك حساب؟</div><button id="returnLoginBtn" type="button">العودة لتسجيل الدخول</button></div>
<div id="authError" class="auth-error"></div>
</form>
</main>
<script src="/js/csp-inline/customer-login-2.js?v=20261019-password-help1"></script>
<script src="/js/csp-inline/customer-login-3.js"></script>
<script src="/js/click-sound.js"></script>
</body>
</html>
