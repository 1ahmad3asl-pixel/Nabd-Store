<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شام كاش دولار - Nabd-Store</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif}.page{width:min(620px,92vw);margin:0 auto;padding:20px 0 44px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.back{width:44px;height:44px;border-radius:14px;background:#151515;border:1px solid #292929;color:#fff;font-size:24px;text-decoration:none;display:flex;align-items:center;justify-content:center}h1{margin:0;font-size:clamp(23px,5vw,32px);font-weight:900}.card{background:#111;border:1px solid #292929;border-radius:22px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.28)}.qr-wrap{text-align:center}.qr{width:min(340px,78vw);height:auto;display:block;margin:0 auto 18px;background:#fff;border-radius:14px;padding:8px}.brand{width:min(220px,58vw);height:auto;display:block;margin:0 auto 24px}.field{margin:0 0 16px}.field label{display:block;margin-bottom:8px;font-weight:900;font-size:14px}.field input[type=number]{width:100%;height:54px;border:1px solid #333;border-radius:13px;background:#171717;color:#fff;padding:0 15px;font-size:16px;outline:0}.field input[type=number]:focus{border-color:#f5c400;box-shadow:0 0 0 3px rgba(245,196,0,.1)}.upload{display:block;border:1px dashed #555;border-radius:14px;background:#151515;padding:17px;text-align:center;cursor:pointer;color:#ddd}.upload input{display:none}.upload strong{display:block;margin-bottom:5px}.upload small{color:#999}.preview{display:none;width:100%;max-height:260px;object-fit:contain;margin:12px auto 0;border-radius:12px;background:#090909}.submit{width:100%;height:52px;border:0;border-radius:13px;background:#f5c400;color:#111;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px}.wallet-id{margin:-10px auto 22px;max-width:100%;overflow:auto;direction:ltr;text-align:center;color:#aaa;font-size:11px;letter-spacing:.2px;word-break:break-all}.submit:disabled{opacity:.55;cursor:not-allowed}.note{text-align:center;color:#999;font-size:12px;line-height:1.8;margin-top:15px}.message{display:none;margin:0 0 15px;padding:12px 14px;border-radius:12px;text-align:center;font-size:13px;line-height:1.7}.message.error{display:block;background:#2a1515;color:#ffb4b4;border:1px solid #5c2929}.message.success{display:block;background:#122417;color:#b7efc3;border:1px solid #275d34}@media(max-width:560px){.card{padding:18px}.qr{width:min(310px,82vw)}}
</style>
</head>
<body>
<main class="page">
<header class="top"><a class="back" href="/add-balance.html" aria-label="العودة">‹</a><h1>شام كاش دولار</h1></header>
<section class="card">
<div class="qr-wrap">
<img class="qr" src="/assets/balance/sham-cash-qr.svg" alt="رمز شام كاش للتحويل">
<img class="brand" src="https://apisyria.com/assets/img/shamcash.png" alt="شام كاش"><div class="wallet-id">6cea5cde8887992e8b639edbfbb10dd3</div>
</div>
<div id="message" class="message"></div>
<form id="depositForm">
<div class="field"><label for="amount">المبلغ</label><input id="amount" name="amount" type="number" min="1" step="0.01" inputmode="decimal" placeholder="أدخل المبلغ المطلوب" required></div>
<div class="field"><label class="upload"><input id="receipt" name="receipt" type="file" accept="image/jpeg,image/png,image/webp" required><strong>رفع صورة الحوالة</strong><small id="fileName">اضغط هنا لاختيار صورة الحوالة</small><img id="preview" class="preview" alt="معاينة صورة الحوالة"></label></div>
<button class="submit" id="submitBtn" type="submit">إرسال طلب الإيداع</button>
</form>
<div class="note">الحد الأدنى للإيداع هو 1 دولار. لا تتم إضافة الرصيد تلقائيًا؛ تتم مراجعة الحوالة ثم إضافته من الإدارة.</div>
</section>
</main>
<script>
(function(){
const form=document.getElementById("depositForm"), amount=document.getElementById("amount"), receipt=document.getElementById("receipt"), preview=document.getElementById("preview"), fileName=document.getElementById("fileName"), msg=document.getElementById("message"), submit=document.getElementById("submitBtn");
function showMessage(text,type){msg.className="message "+type;msg.textContent=text}
async function requireLogin(){
 try{
  const r=await fetch("/api/customer/me",{credentials:"same-origin",headers:{"Accept":"application/json"},cache:"no-store"});
  if(!r.ok){window.location.href="/customer-login.html";return false}
  return true
 }catch(e){showMessage("تعذر التحقق من تسجيل الدخول. حاول مرة أخرى.","error");return false}
}
receipt.addEventListener("change",function(){
 const file=receipt.files&&receipt.files[0]; if(!file)return;
 fileName.textContent=file.name;
 const reader=new FileReader(); reader.onload=function(){preview.src=reader.result;preview.style.display="block"}; reader.readAsDataURL(file);
});
form.addEventListener("submit",async function(e){
 e.preventDefault(); showMessage("",""); msg.className="message";
 const ok=await requireLogin(); if(!ok)return;
 const value=Number(amount.value); const file=receipt.files&&receipt.files[0];
 if(!Number.isFinite(value)||value<1){showMessage("الحد الأدنى للإيداع هو 1 دولار.","error");return}
 if(!file){showMessage("اختر صورة الحوالة أولًا.","error");return}
 if(!["image/jpeg","image/png","image/webp"].includes(file.type)){showMessage("ارفع صورة بصيغة JPG أو PNG أو WEBP.","error");return}
 if(file.size>5*1024*1024){showMessage("حجم الصورة يجب ألا يتجاوز 5 ميغابايت.","error");return}
 submit.disabled=true;
 try{
  const imageData=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
  const r=await fetch("/api/customer/balance-deposit/sham-dollar",{method:"POST",credentials:"same-origin",headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify({amount:value,image_data:imageData,image_mime:file.type,image_name:file.name})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok||data.status!=="OK")throw new Error(data.message||"تعذر إرسال الطلب.");
  showMessage(data.message||"تم إرسال طلب الإيداع بنجاح.","success"); form.reset();preview.style.display="none";fileName.textContent="اضغط هنا لاختيار صورة الحوالة";
 }catch(error){showMessage(error.message||"تعذر إرسال الطلب.","error")}
 finally{submit.disabled=false}
});
requireLogin();
})();
</script>
</body>
</html>
