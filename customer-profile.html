<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ملفي الشخصي - Nabd-Store</title><link rel="stylesheet" href="css/style.css?v=20261019-cache1">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:20px}.profile-card{width:min(500px,100%);background:var(--white);color:var(--text);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.profile-card h1{margin-bottom:8px}.avatar-wrap{text-align:center;margin-bottom:20px}.avatar-preview{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid var(--border);background:var(--background);display:block;margin:0 auto 12px}.avatar-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.avatar-btn{padding:10px 15px;border:1px solid var(--border);border-radius:10px;background:var(--background);color:var(--text);font-weight:900;cursor:pointer}.avatar-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.avatar-note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}.profile-card p{color:var(--muted);line-height:1.8}.profile-form label{display:block;font-weight:900;margin:16px 0 7px}.form-input,.phone-country,.phone-number{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--border);background:var(--background);color:var(--text);border-radius:10px;font-size:16px;outline:0}.form-input:focus,.phone-country:focus,.phone-number:focus{border-color:var(--primary)}.phone-row{display:grid;grid-template-columns:145px 1fr;gap:8px;direction:ltr}.phone-country{direction:ltr;cursor:pointer} .phone-country option{font-family:"Dubai Medium","Dubai",Tahoma,Arial,sans-serif}.save-btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:900;font-size:16px;cursor:pointer}.error{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#ffe8e8;color:#a00}.skip{display:block;text-align:center;margin-top:14px;color:var(--muted);text-decoration:none}.loading{color:var(--muted);font-size:14px;margin-top:8px}@media(max-width:380px){.phone-row{grid-template-columns:125px 1fr}}
</style></head>
<body><div id="newCustomerWelcome" style="display:none;position:fixed;inset:0;z-index:9999;place-items:center;background:rgba(10,10,10,.96);color:#fff;text-align:center"><div><div style="font-size:52px">🌹</div><div style="font-size:30px;font-weight:900">حياك اللّٰه</div></div></div><main class="profile-card"><div style="font-size:42px">📱</div><h1>إكمال ملفك الشخصي</h1><p>اختر علم دولتك ومفتاح الاتصال، ثم اكتب رقمك المحلي بدون مفتاح الدولة.</p>
<div class="avatar-wrap"><img id="avatarPreview" class="avatar-preview" alt="الصورة الشخصية" src="" hidden><div id="avatarPlaceholder" style="font-size:70px;line-height:112px;width:112px;height:112px;border-radius:50%;margin:0 auto 12px;background:var(--background);border:4px solid var(--border)">👤</div><div class="avatar-actions"><button type="button" class="avatar-btn primary" id="chooseAvatar">اختيار صورة</button><button type="button" class="avatar-btn" id="removeAvatar" hidden>حذف الصورة</button></div><input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><div class="avatar-note">اختر صورة من معرض هاتفك، وسيتم تصغيرها تلقائيًا.</div></div><form id="profileForm" class="profile-form"><label for="name">الاسم</label><input id="name" class="form-input" type="text" autocomplete="name" required><label for="phoneNumber">رقم الهاتف</label>
<div class="phone-row"><select id="phoneCountry" class="phone-country" aria-label="الدولة" disabled></select><input id="phoneNumber" class="phone-number" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="رقم الهاتف" required></div>
<div id="countryLoading" class="loading">جاري تحميل قائمة الدول…</div><button class="save-btn" id="saveBtn" type="submit">حفظ ومتابعة إلى المتجر</button><div id="error" class="error"></div></form></main>
<script src="/js/csp-inline/customer-profile-1.js?v=20261019-js1"></script><script src="/js/click-sound.js?v=20261019-js1"></script>
</body></html>
