<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>إكمال الملف الشخصي - Nabd-Store</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:20px}
.profile-card{width:min(500px,100%);background:var(--white);color:var(--text);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.profile-card h1{margin-bottom:8px}.profile-card p{color:var(--muted);line-height:1.8}
.profile-form label{display:block;font-weight:900;margin:16px 0 7px}
.phone-row{display:grid;grid-template-columns:150px 1fr;gap:8px;direction:ltr}
.phone-country,.phone-number{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--border);background:var(--background);color:var(--text);border-radius:10px;font-size:16px;outline:0}
.phone-country:focus,.phone-number:focus{border-color:var(--primary)}
.phone-country{direction:ltr;cursor:pointer}
.save-btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.error{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#ffe8e8;color:#a00}
.skip{display:block;text-align:center;margin-top:14px;color:var(--muted);text-decoration:none}
@media(max-width:380px){.phone-row{grid-template-columns:125px 1fr}}
</style>
</head>
<body>
<main class="profile-card">
<div style="font-size:42px">📱</div>
<h1>إكمال ملفك الشخصي</h1>
<p>أدخل رقم هاتفك. اختر علم دولتك ومفتاحها، ثم اكتب رقمك بدون مفتاح الدولة.</p>
<form id="profileForm" class="profile-form">
<label for="name">الاسم</label>
<input id="name" type="text" autocomplete="name" required style="width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--border);background:var(--background);color:var(--text);border-radius:10px;font-size:16px;outline:0">
<label for="phoneNumber">رقم الهاتف</label>
<div class="phone-row">
<select id="phoneCountry" class="phone-country" aria-label="الدولة">
<option value="+963" data-flag="🇸🇾">🇸🇾 +963</option>
<option value="+90" data-flag="🇹🇷">🇹🇷 +90</option>
<option value="+1" data-flag="🇺🇸">🇺🇸 +1</option>
<option value="+44" data-flag="🇬🇧">🇬🇧 +44</option>
<option value="+49" data-flag="🇩🇪">🇩🇪 +49</option>
<option value="+33" data-flag="🇫🇷">🇫🇷 +33</option>
<option value="+39" data-flag="🇮🇹">🇮🇹 +39</option>
<option value="+34" data-flag="🇪🇸">🇪🇸 +34</option>
<option value="+31" data-flag="🇳🇱">🇳🇱 +31</option>
<option value="+32" data-flag="🇧🇪">🇧🇪 +32</option>
<option value="+41" data-flag="🇨🇭">🇨🇭 +41</option>
<option value="+43" data-flag="🇦🇹">🇦🇹 +43</option>
<option value="+45" data-flag="🇩🇰">🇩🇰 +45</option>
<option value="+46" data-flag="🇸🇪">🇸🇪 +46</option>
<option value="+47" data-flag="🇳🇴">🇳🇴 +47</option>
<option value="+30" data-flag="🇬🇷">🇬🇷 +30</option>
<option value="+7" data-flag="🇷🇺">🇷🇺 +7</option>
<option value="+20" data-flag="🇪🇬">🇪🇬 +20</option>
<option value="+212" data-flag="🇲🇦">🇲🇦 +212</option>
<option value="+213" data-flag="🇩🇿">🇩🇿 +213</option>
<option value="+216" data-flag="🇹🇳">🇹🇳 +216</option>
<option value="+218" data-flag="🇱🇾">🇱🇾 +218</option>
<option value="+964" data-flag="🇮🇶">🇮🇶 +964</option>
<option value="+962" data-flag="🇯🇴">🇯🇴 +962</option>
<option value="+961" data-flag="🇱🇧">🇱🇧 +961</option>
<option value="+970" data-flag="🇵🇸">🇵🇸 +970</option>
<option value="+972" data-flag="🇮🇱">🇮🇱 +972</option>
<option value="+974" data-flag="🇶🇦">🇶🇦 +974</option>
<option value="+965" data-flag="🇰🇼">🇰🇼 +965</option>
<option value="+966" data-flag="🇸🇦">🇸🇦 +966</option>
<option value="+971" data-flag="🇦🇪">🇦🇪 +971</option>
<option value="+973" data-flag="🇧🇭">🇧🇭 +973</option>
<option value="+968" data-flag="🇴🇲">🇴🇲 +968</option>
<option value="+967" data-flag="🇾🇪">🇾🇪 +967</option>
<option value="+91" data-flag="🇮🇳">🇮🇳 +91</option>
<option value="+92" data-flag="🇵🇰">🇵🇰 +92</option>
<option value="+880" data-flag="🇧🇩">🇧🇩 +880</option>
<option value="+86" data-flag="🇨🇳">🇨🇳 +86</option>
<option value="+81" data-flag="🇯🇵">🇯🇵 +81</option>
<option value="+82" data-flag="🇰🇷">🇰🇷 +82</option>
<option value="+55" data-flag="🇧🇷">🇧🇷 +55</option>
<option value="+52" data-flag="🇲🇽">🇲🇽 +52</option>
<option value="+61" data-flag="🇦🇺">🇦🇺 +61</option>
<option value="+64" data-flag="🇳🇿">🇳🇿 +64</option>
<option value="+27" data-flag="🇿🇦">🇿🇦 +27</option>
</select>
<input id="phoneNumber" class="phone-number" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="9XX XXX XXX" required>
</div>
<button class="save-btn" id="saveBtn" type="submit">حفظ ومتابعة إلى المتجر</button>
<div id="error" class="error"></div>
</form>
<a class="skip" href="/">العودة إلى المتجر</a>
</main>
<script>
const form=document.getElementById("profileForm"),nameInput=document.getElementById("name"),countrySelect=document.getElementById("phoneCountry"),phoneNumber=document.getElementById("phoneNumber"),error=document.getElementById("error"),saveBtn=document.getElementById("saveBtn");
const countries=[...countrySelect.options].map(o=>o.value);
function splitPhone(phone){
 const raw=String(phone||"").trim();
 if(!raw.startsWith("+"))return;
 const match=countries.sort((a,b)=>b.length-a.length).find(code=>raw.startsWith(code));
 if(match){countrySelect.value=match;phoneNumber.value=raw.slice(match.length).replace(/\s+/g,"");}
}
async function loadProfile(){
 try{
  const r=await fetch("/api/customer/auth/me",{headers:{Accept:"application/json"}});
  if(!r.ok){location.href="/customer-login.html";return;}
  const data=await r.json(),c=data.customer||{};
  nameInput.value=c.name||"";
  splitPhone(c.phone||"");
 }catch(e){error.textContent="تعذر تحميل بيانات الحساب.";error.style.display="block";}
}
form.addEventListener("submit",async e=>{
 e.preventDefault();error.style.display="none";saveBtn.disabled=true;
 try{
  const number=phoneNumber.value.replace(/\D/g,"");
  const phone=countrySelect.value+number;
  const r=await fetch("/api/customer/profile",{method:"PUT",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({name:nameInput.value.trim(),phone})});
  const data=await r.json();
  if(!r.ok)throw new Error(data.message||"تعذر حفظ الملف الشخصي.");
  location.href="/";
 }catch(err){error.textContent=err.message;error.style.display="block";}finally{saveBtn.disabled=false;}
});
loadProfile();
</script>
</body>
</html>
