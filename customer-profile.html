<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ملفي الشخصي - Nabd-Store</title><link rel="stylesheet" href="css/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:20px}.profile-card{width:min(500px,100%);background:var(--white);color:var(--text);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.profile-card h1{margin-bottom:8px}.profile-card p{color:var(--muted);line-height:1.8}.profile-form label{display:block;font-weight:900;margin:16px 0 7px}.form-input,.phone-country,.phone-number{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--border);background:var(--background);color:var(--text);border-radius:10px;font-size:16px;outline:0}.form-input:focus,.phone-country:focus,.phone-number:focus{border-color:var(--primary)}.phone-row{display:grid;grid-template-columns:145px 1fr;gap:8px;direction:ltr}.phone-country{direction:ltr;cursor:pointer}.phone-country option{font-family:Arial,sans-serif}.save-btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:900;font-size:16px;cursor:pointer}.error{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#ffe8e8;color:#a00}.skip{display:block;text-align:center;margin-top:14px;color:var(--muted);text-decoration:none}.loading{color:var(--muted);font-size:14px;margin-top:8px}@media(max-width:380px){.phone-row{grid-template-columns:125px 1fr}}
</style></head>
<body><main class="profile-card"><div style="font-size:42px">📱</div><h1>إكمال ملفك الشخصي</h1><p>اختر علم دولتك ومفتاح الاتصال، ثم اكتب رقمك المحلي بدون مفتاح الدولة.</p>
<form id="profileForm" class="profile-form"><label for="name">الاسم</label><input id="name" class="form-input" type="text" autocomplete="name" required><label for="phoneNumber">رقم الهاتف</label>
<div class="phone-row"><select id="phoneCountry" class="phone-country" aria-label="الدولة" disabled></select><input id="phoneNumber" class="phone-number" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="رقم الهاتف" required></div>
<div id="countryLoading" class="loading">جاري تحميل قائمة الدول…</div><button class="save-btn" id="saveBtn" type="submit">حفظ ومتابعة إلى المتجر</button><div id="error" class="error"></div></form><a class="skip" href="/">العودة إلى المتجر</a></main>
<script>
const form=document.getElementById("profileForm"),nameInput=document.getElementById("name"),countrySelect=document.getElementById("phoneCountry"),phoneNumber=document.getElementById("phoneNumber"),error=document.getElementById("error"),saveBtn=document.getElementById("saveBtn"),countryLoading=document.getElementById("countryLoading");let countries=[];
function flagFromIso(iso){return String(iso||"").toUpperCase().replace(/[A-Z]/g,c=>String.fromCodePoint(c.charCodeAt(0)+127397));}
async function loadCountries(){const r=await fetch("/api/customer/countries",{headers:{Accept:"application/json"}}),data=await r.json();if(!r.ok||!Array.isArray(data.countries))throw new Error("تعذر تحميل قائمة الدول.");countries=data.countries;countrySelect.innerHTML="";countries.forEach(item=>{const option=document.createElement("option");option.value=item.country;option.textContent=flagFromIso(item.country)+" "+item.calling_code;option.dataset.callingCode=item.calling_code;countrySelect.appendChild(option);});countrySelect.disabled=false;countryLoading.remove();}
function setCountryByPhone(phone){const raw=String(phone||"").replace(/\s+/g,"");if(!raw.startsWith("+"))return;const sorted=[...countries].sort((a,b)=>b.calling_code.length-a.calling_code.length),match=sorted.find(item=>raw.startsWith(item.calling_code));if(match){countrySelect.value=match.country;phoneNumber.value=raw.slice(match.calling_code.length);}}
async function loadProfile(){const r=await fetch("/api/customer/auth/me",{headers:{Accept:"application/json"}});if(!r.ok){location.href="/customer-login.html";return;}const data=await r.json(),c=data.customer||{};nameInput.value=c.name||"";setCountryByPhone(c.phone||"");}
form.addEventListener("submit",async e=>{e.preventDefault();error.style.display="none";saveBtn.disabled=true;try{if(countrySelect.disabled)throw new Error("انتظر حتى تكتمل قائمة الدول.");const number=phoneNumber.value.replace(/\D/g,""),selected=countries.find(item=>item.country===countrySelect.value);if(!number)throw new Error("أدخل رقم الهاتف.");if(!selected)throw new Error("اختر الدولة.");const phone=selected.calling_code+number;const r=await fetch("/api/customer/profile",{method:"PUT",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({name:nameInput.value.trim(),phone})}),data=await r.json();if(!r.ok)throw new Error(data.message||"تعذر حفظ الملف الشخصي.");location.href="/";}catch(err){error.textContent=err.message;error.style.display="block";}finally{saveBtn.disabled=false;}});
(async()=>{try{await loadCountries();await loadProfile();}catch(e){error.textContent=e.message||"تعذر تحميل البيانات.";error.style.display="block";}})();
</script></body></html>
