<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الإدارة - Nabd-Store</title>
<link rel="stylesheet" href="admin.css">
<style>
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(430px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.login-card h1{margin:0 0 8px}.login-card p{color:#666;margin:0 0 24px}
.login-card label{display:block;margin:14px 0 7px;font-weight:700}
.login-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.login-card button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;cursor:pointer;font-size:16px}
.login-error{display:none;margin-top:14px;padding:10px;border-radius:10px;background:#ffe8e8;color:#a00}
</style>
</head>
<body>
<main class="login-page">
<section class="login-card">
<div style="font-size:42px">👑</div>
<h1>دخول لوحة الإدارة</h1>
<p>هذه الصفحة مخصصة لمالك متجر Nabd-Store.</p>
<form id="loginForm">
<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginButton" type="submit" class="primary-button">تسجيل الدخول</button>
<div id="loginError" class="login-error"></div>
</form>
</section>
</main>
<script>
const form=document.getElementById("loginForm");
const button=document.getElementById("loginButton");
const error=document.getElementById("loginError");
form.addEventListener("submit",async function(event){
 event.preventDefault();
 error.style.display="none";
 button.disabled=true;
 try{
  const response=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});
  const data=await response.json();
  if(!response.ok) throw new Error(data.message||"تعذر تسجيل الدخول");
  window.location.href="/admin/index.html";
 }catch(e){
  error.textContent=e.message;
  error.style.display="block";
 }finally{button.disabled=false;}
});
</script>
</body>
</html>
