<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f4f4f4;
color:#333;
}

header{
background:#1f2937;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.hero{
height:80vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:42px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
margin-bottom:25px;
}

button{
padding:15px 35px;
border:none;
background:#2563eb;
color:white;
font-size:18px;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

footer{
background:#1f2937;
color:white;
text-align:center;
padding:15px;
}
</style>

</head>
<body>

<header>
موقعي
</header>

<section class="hero">
<h1>مرحبًا بك</h1>
<p>هذه واجهة الموقع الأولية.</p>
<button>ابدأ الآن</button>
</section>

<footer>
جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>
