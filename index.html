<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nabd-Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:linear-gradient(180deg,#0d0d0d,#1b1b1b);
color:#f5d36b;
}

header{
background:#111;
color:#f5d36b;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
border-bottom:2px solid #d4af37;
}

.hero{
height:80vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:42px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
margin-bottom:25px;
}

button{
padding:15px 35px;
border:none;
background:#d4af37;
color:#111;
font-size:18px;
font-weight:bold;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#f5d36b;
}

footer{
background:#111;
color:#d4af37;
text-align:center;
padding:15px;
border-top:2px solid #d4af37;
}
</style>

</head>
<body>

<header>
Nabd-Store
</header>

<section class="hero">
<h1>مرحبًا بك</h1>
<p>هذه واجهة الموقع الأولية.</p>
<button>ابدأ الآن</button>
</section>

<footer>
جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>
