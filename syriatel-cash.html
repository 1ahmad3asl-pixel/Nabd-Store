<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>سيرياتيل كاش - Nabd-Store</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif}.page{width:min(620px,92vw);margin:0 auto;padding:20px 0 44px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.back{width:44px;height:44px;border-radius:14px;background:#151515;border:1px solid #292929;color:#fff;font-size:24px;text-decoration:none;display:flex;align-items:center;justify-content:center}h1{margin:0;font-size:clamp(23px,5vw,32px);font-weight:900}.card{background:#111;border:1px solid #292929;border-radius:22px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.28)}.rate-card{margin:0 auto 20px;padding:16px;border:1px solid #292929;border-radius:18px;background:#111;text-align:center}.rate-label{display:block;font-size:16px;color:#fff;font-weight:900;margin-bottom:6px}.rate-value strong{display:block;font-size:26px;line-height:1.35}.rate-value small{font-size:13px;color:#bbb;font-weight:700}.qr-wrap{text-align:center}.minimum-note{text-align:center;color:#f5c400;font-size:15px;font-weight:900;line-height:1.8;margin:0 0 18px}.warning{display:inline-block;margin:0 6px;font-size:18px;vertical-align:-2px}.wallet-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 22px;direction:ltr;flex-wrap:wrap}.wallet-id{margin:0;max-width:calc(100% - 48px);overflow-wrap:anywhere;direction:ltr;text-align:center;color:#aaa;font-size:12px;letter-spacing:.2px;word-break:break-all}.copy-btn{width:36px;height:36px;border:1px solid #3a3a3a;border-radius:10px;background:#191919;color:#f5c400;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}.copy-btn:hover{border-color:#f5c400;background:#202020}.copy-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.copy-btn.copied{color:#9ff0ae;border-color:#3a6f45}.copy-status{font-size:11px;color:#9ff0ae;display:none;width:100%;text-align:center;margin-top:2px}.qr-placeholder{width:min(100%,420px);aspect-ratio:1/1;background:#fff;border-radius:0;margin:0 auto 18px}.field{margin:0 0 16px}.field label{display:block;margin-bottom:8px;font-weight:900;font-size:14px}.field input[type=number]{width:100%;height:54px;border:1px solid #333;border-radius:13px;background:#171717;color:#fff;padding:0 15px;font-size:16px;outline:0}.field input[type=number]:focus{border-color:#f5c400;box-shadow:0 0 0 3px rgba(245,196,0,.1)}.upload{display:block;border:1px dashed #555;border-radius:14px;background:#151515;padding:17px;text-align:center;cursor:pointer;color:#ddd}.upload input{display:none}.upload strong{display:block;margin-bottom:5px}.upload small{color:#999}.preview{display:none;width:100%;max-height:260px;object-fit:contain;margin:12px auto 0;border-radius:12px;background:#090909}.submit{width:100%;height:52px;border:0;border-radius:13px;background:#f5c400;color:#111;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px}.submit:disabled{opacity:.55;cursor:not-allowed}.message{display:none;margin:0 0 15px;padding:12px 14px;border-radius:12px;text-align:center;font-size:13px;line-height:1.7}.message.error{display:block;background:#2a1515;color:#ffb4b4;border:1px solid #5c2929}.message.success{display:block;background:#122417;color:#b7efc3;border:1px solid #275d34}@media(max-width:560px){.card{padding:18px}.rate-value strong{font-size:22px}}
</style></head>
<body><main class="page"><header class="top"><a class="back" href="/add-balance.html" aria-label="العودة">‹</a><h1>سيرياتيل كاش</h1></header>
<section class="rate-card" id="sypRateCard" aria-label="سعر الصرف"><span class="rate-label">سعر الصرف ل.س/$</span><div class="rate-value"><strong id="sypStoreRate">—</strong><small>ليرة سورية للدولار الواحد</small></div></section>
<section class="card"><div class="qr-wrap"><div class="minimum-note"><span class="warning" aria-hidden="true">⚠️</span> الحد الأدنى للإيداع هو <span id="minimumRate" dir="ltr">—</span> ليرة سورية <span class="warning" aria-hidden="true">⚠️</span></div><div class="qr-placeholder" aria-label="صورة بيضاء للتحويل"></div><div class="wallet-row"><span class="wallet-id" id="walletId">6cea5cde8887992e8b639edbfbb10dd3</span><button class="copy-btn" id="copyWalletId" type="button" aria-label="نسخ معرف سيرياتيل كاش" title="نسخ" onclick="copyWalletId()"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button><span class="copy-status" id="copyStatus">تم النسخ</span></div></div><div id="message" class="message"></div><form id="depositForm"><div class="field"><label for="amount">المبلغ</label><input id="amount" name="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="أدخل المبلغ المطلوب" required></div><div class="field"><label class="upload"><input id="receipt" name="receipt" type="file" accept="image/jpeg,image/png,image/webp" required><strong>رفع صورة الحوالة</strong><small id="fileName">اضغط هنا لاختيار صورة الحوالة</small><img id="preview" class="preview" alt="معاينة صورة الحوالة"></label></div><button class="submit" id="submitBtn" type="submit">إرسال طلب الإيداع</button></form></section></main>
<script>
let minimumSyp=0;
(async function(){const storeEl=document.getElementById("sypStoreRate"),minEl=document.getElementById("minimumRate");try{const response=await fetch("/api/exchange-rate?_="+Date.now(),{headers:{"Accept":"application/json"},credentials:"same-origin",cache:"no-store"}),data=await response.json();if(!response.ok||data.status!=="OK"||!data.rate)throw new Error();const buy=Number(data.rate.buy),rate=Number.isFinite(buy)?Math.ceil(buy+5):NaN;if(!Number.isFinite(rate))throw new Error();minimumSyp=rate;const formatted=rate.toLocaleString("en-US");storeEl.textContent=formatted;minEl.textContent=formatted;}catch(error){storeEl.textContent="—";minEl.textContent="—"}})();
async function copyWalletId(){const id=document.getElementById("walletId"),btn=document.getElementById("copyWalletId"),status=document.getElementById("copyStatus");try{await navigator.clipboard.writeText(id.textContent.trim())}catch(e){const range=document.createRange();range.selectNodeContents(id);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);document.execCommand("copy");sel.removeAllRanges()}btn.classList.add("copied");status.style.display="block";setTimeout(function(){btn.classList.remove("copied");status.style.display="none"},1500)}
(function(){const form=document.getElementById("depositForm"),amount=document.getElementById("amount"),receipt=document.getElementById("receipt"),preview=document.getElementById("preview"),fileName=document.getElementById("fileName"),msg=document.getElementById("message"),submit=document.getElementById("submitBtn");function showMessage(text,type){msg.className="message "+type;msg.textContent=text}async function requireLogin(){try{const r=await fetch("/api/customer/me",{credentials:"same-origin",headers:{"Accept":"application/json"},cache:"no-store"});if(!r.ok){window.location.href="/customer-login.html";return false}return true}catch(e){showMessage("تعذر التحقق من تسجيل الدخول. حاول مرة أخرى.","error");return false}}receipt.addEventListener("change",function(){const file=receipt.files&&receipt.files[0];if(!file)return;fileName.textContent=file.name;const reader=new FileReader();reader.onload=function(){preview.src=reader.result;preview.style.display="block"};reader.readAsDataURL(file)});form.addEventListener("submit",async function(e){e.preventDefault();showMessage("","");msg.className="message";const ok=await requireLogin();if(!ok)return;const value=Number(amount.value),file=receipt.files&&receipt.files[0];if(!Number.isFinite(value)||value<1){showMessage("الحد الأدنى للإيداع هو سعر الصرف المعتمد.","error");return}if(minimumSyp&&value<minimumSyp){showMessage("الحد الأدنى للإيداع هو "+minimumSyp.toLocaleString("en-US")+" ليرة سورية.","error");return}if(!file){showMessage("اختر صورة الحوالة أولًا.","error");return}if(!["image/jpeg","image/png","image/webp"].includes(file.type)){showMessage("ارفع صورة بصيغة JPG أو PNG أو WEBP.","error");return}if(file.size>5*1024*1024){showMessage("حجم الصورة يجب ألا يتجاوز 5 ميغابايت.","error");return}submit.disabled=true;try{const imageData=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const r=await fetch("/api/customer/balance-deposit/syriatel-cash",{method:"POST",credentials:"same-origin",headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify({amount:value,image_data:imageData,image_mime:file.type,image_name:file.name})});const data=await r.json().catch(()=>({}));if(!r.ok||data.status!=="OK")throw new Error(data.message||"تعذر إرسال الطلب.");showMessage(data.message||"تم إرسال طلب الإيداع بنجاح.","success");submit.textContent="تم الإرسال";form.reset();preview.style.display="none";fileName.textContent="تم إرسال الطلب بنجاح";setTimeout(function(){window.location.reload()},1600)}catch(error){showMessage(error.message||"تعذر إرسال الطلب.","error")}finally{submit.disabled=false}});requireLogin()})();
</script><script src="/js/click-sound.js"></script>
</body></html>
