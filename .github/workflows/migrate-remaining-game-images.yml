name: Migrate remaining game images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-remaining-game-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Download and normalize the seven remaining images
        env:
          MOBILE_LEGENDS_URL: "https://play-lh.googleusercontent.com/D8r13ijO9c-0_1N-CP4d63mR1w6YhDuR2mBQUl27ELJAx0sKdaKtM5vCUnSLODKBVzUx7rZ9cW4Ir9jYiufsSQ=w512-h512"
          HERO_CLASH_URL: "https://play-lh.googleusercontent.com/QcK92YDvZvO12YdulWud9qkTmVyVXKWKZKEfzgsEqo1SAzsK5k-m5OjOiqXazJjsvz3wCG42oSu4sKYN1Qnpzg=w512-h512"
          OXIDE_URL: "https://play-lh.googleusercontent.com/angXGBMMY51cmjEacSarq1uV5Olbui9cCQr9BaRNpGcRNv1JrK0Y0JRRq5KqD1pT7jjgWYO1p6BFNlgmME-O=w512-h512"
          KING_SHOT_URL: "https://play-lh.googleusercontent.com/cs59HOM5uSmSzgnmMyFpqYw9sMtQkYxMUTRZ1TSCZK6t6T-cjluQW_9krAcgeEozBYQWKl2DmUTeETdYtKhq=w512-h512"
          ZEPETO_URL: "https://asset-zepetoful.zepeto.io/Hc/f0w20tzo7x3G/Hc4io3wK87cuiHDwDHDVs5a/en"
          DEVIL_MAY_CRY_URL: "https://play-lh.googleusercontent.com/AHmibcY_e63qLsvPBEwHrJ8d-ZYO1xCh8WQzcSYR6MDtECbFE9utcnos7D56sl-gO7yTusVxbuutowDux5bsmQ=w512-h512"
          CRYSTAL_OF_ATLAN_URL: "https://play-lh.googleusercontent.com/8c3AQpfPuglekYgsbGoOzm5b7q0CknK5ECc9KprBd-tJ6krkEguzoadAFvqcYBXmq5WvclIz_FQePSW3oxPl6Q=w512-h512"
        run: |
          set -euo pipefail
          mkdir -p /tmp/game-images public/game-images

          curl -fL --retry 3 --retry-all-errors "$MOBILE_LEGENDS_URL" -o /tmp/game-images/mobile-legends.raw
          curl -fL --retry 3 --retry-all-errors "$HERO_CLASH_URL" -o /tmp/game-images/hero-clash.raw
          curl -fL --retry 3 --retry-all-errors "$OXIDE_URL" -o /tmp/game-images/oxide-survival-island.raw
          curl -fL --retry 3 --retry-all-errors "$KING_SHOT_URL" -o /tmp/game-images/king-shot.raw
          curl -fL --retry 3 --retry-all-errors "$ZEPETO_URL" -o /tmp/game-images/zepeto.raw
          curl -fL --retry 3 --retry-all-errors "$DEVIL_MAY_CRY_URL" -o /tmp/game-images/devil-may-cry.raw
          curl -fL --retry 3 --retry-all-errors "$CRYSTAL_OF_ATLAN_URL" -o /tmp/game-images/crystal-of-atlan.raw

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          mapping = {
              "mobile-legends": "mobile-legends.png",
              "hero-clash": "hero-clash.png",
              "oxide-survival-island": "oxide-survival-island.png",
              "king-shot": "king-shot.png",
              "zepeto": "zepeto.png",
              "devil-may-cry": "devil-may-cry.png",
              "crystal-of-atlan": "crystal-of-atlan.png",
          }

          for stem, target in mapping.items():
              src = Path("/tmp/game-images") / f"{stem}.raw"
              dst = Path("public/game-images") / target
              with Image.open(src) as im:
                  im = im.convert("RGBA")
                  im.save(dst, format="PNG", optimize=True)
                  print(f"{target}: {im.size[0]}x{im.size[1]} PNG")
          PY

      - name: Verify seven files
        run: |
          set -euo pipefail
          test -s public/game-images/mobile-legends.png
          test -s public/game-images/hero-clash.png
          test -s public/game-images/oxide-survival-island.png
          test -s public/game-images/king-shot.png
          test -s public/game-images/zepeto.png
          test -s public/game-images/devil-may-cry.png
          test -s public/game-images/crystal-of-atlan.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = [
              "mobile-legends.png","hero-clash.png","oxide-survival-island.png",
              "king-shot.png","zepeto.png","devil-may-cry.png","crystal-of-atlan.png"
          ]
          for name in files:
              p=Path("public/game-images")/name
              with Image.open(p) as im:
                  assert im.format == "PNG"
                  assert im.width > 0 and im.height > 0
                  print(name, im.size, p.stat().st_size)
          PY

      - name: Commit images and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "Nabd-Store-ON"
          git config user.email "1ahmad3asl@gmail.com"
          git add public/game-images/mobile-legends.png public/game-images/hero-clash.png public/game-images/oxide-survival-island.png public/game-images/king-shot.png public/game-images/zepeto.png public/game-images/devil-may-cry.png public/game-images/crystal-of-atlan.png
          git add .github/workflows/migrate-remaining-game-images.yml
          git rm .github/workflows/migrate-remaining-game-images.yml
          git commit -m "Migrate remaining seven game images"
          git push origin main
