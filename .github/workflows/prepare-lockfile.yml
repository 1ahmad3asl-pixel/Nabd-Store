name: Prepare package lockfile

on:
  push:
    branches:
      - security/prepare-lockfile

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/prepare-lockfile
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "Add npm dependency lockfile"
              git push origin HEAD:security/prepare-lockfile
            fi
          else
            echo "package-lock.json was not generated" >&2
            exit 1
          fi
