name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check server syntax
        run: node --check server.js

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r -n 1 node --check
