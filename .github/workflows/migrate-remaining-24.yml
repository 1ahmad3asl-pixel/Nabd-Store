name: Migrate game images - 3 batches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-remaining-24.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_HOST: https://nabd-store.onrender.com/api/game-images

jobs:
  batch1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download batch 1
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow requests
          python3 - <<'PY'
          from pathlib import Path
          import requests, re, os
          from PIL import Image
          from io import BytesIO

          items = {
            "ludo-club":"com.moonfrog.ludo.club",
            "lords-mobile":"com.igg.android.lordsmobile",
            "magic-chess-gogo":"com.mobilechess.gp",
            "marvel-duel":"com.netease.mduelna",
            "marvel-mystic-mayhem":"com.netease.mmm",
            "marvel-rivals":"marvel-rivals-official",
            "mirage-perfect-skyline":"com.eyougame.xmqx.en",
            "mobile-legends":"com.mobile.legends",
          }
          out=Path("batch1"); out.mkdir()
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0"})
          for name, package in items.items():
              data=None
              try:
                  r=s.get(f"{os.environ['IMAGE_HOST']}/{name}",timeout=90)
                  if r.ok and r.content:
                      data=r.content
              except Exception:
                  pass
              if data is None and package != "marvel-rivals-official":
                  page=s.get(f"https://play.google.com/store/apps/details?id={package}&hl=en",timeout=90)
                  m=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',page.text,re.I)
                  if not m:
                      m=re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',page.text,re.I)
                  if m:
                      data=s.get(m.group(1).replace("&amp;","&"),timeout=90).content
              if not data:
                  raise RuntimeError(f"No image source: {name}")
              im=Image.open(BytesIO(data)); im.load()
              im=im.convert("RGBA") if im.mode not in ("RGB","RGBA") else im
              im.save(out/f"{name}.png",format="PNG",optimize=False)
              print(name, im.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: game-images-batch1
          path: batch1

  batch2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download batch 2
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow requests
          python3 - <<'PY'
          from pathlib import Path
          import requests, re, os
          from PIL import Image
          from io import BytesIO

          items = {
            "modern-strike-online":"com.gamedevlab.modernstrike",
            "mongil-star-dive":"com.cjenm.mongil",
            "my-singing-monsters":"com.bigbluebubble.singingmonsters.full",
            "onmyoji-arena":"com.netease.g78na.gb",
            "oxide-survival-island":"com.catsbit.oxidesurvivalisland",
            "overmortal-idle-global":"com.xsupergame.overmortal",
            "project-entropy":"com.entropy.global",
            "pubg-mobile":"com.tencent.ig",
          }
          out=Path("batch2"); out.mkdir()
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0"})
          for name, package in items.items():
              data=None
              try:
                  r=s.get(f"{os.environ['IMAGE_HOST']}/{name}",timeout=90)
                  if r.ok and r.content: data=r.content
              except Exception: pass
              if data is None:
                  page=s.get(f"https://play.google.com/store/apps/details?id={package}&hl=en",timeout=90)
                  m=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',page.text,re.I) or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',page.text,re.I)
                  if m: data=s.get(m.group(1).replace("&amp;","&"),timeout=90).content
              if not data: raise RuntimeError(f"No image source: {name}")
              im=Image.open(BytesIO(data)); im.load()
              im=im.convert("RGBA") if im.mode not in ("RGB","RGBA") else im
              im.save(out/f"{name}.png",format="PNG",optimize=False)
              print(name, im.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: game-images-batch2
          path: batch2

  batch3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download batch 3
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow requests
          python3 - <<'PY'
          from pathlib import Path
          import requests, re, os
          from PIL import Image
          from io import BytesIO

          items = {
            "roblox":"com.roblox.client",
            "rise-of-kingdoms":"com.lilithgame.roc.gp",
            "stormshot":"com.funplus.ss",
            "stumble-guys":"com.kitkagames.fallbuddies",
            "super-sus":"com.je.supersus",
            "top-war":"com.Topwar.gp",
            "whiteout-survival":"com.gof.global",
            "yalla-ludo":"com.yalla.yallagames",
          }
          out=Path("batch3"); out.mkdir()
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0"})
          for name, package in items.items():
              data=None
              try:
                  r=s.get(f"{os.environ['IMAGE_HOST']}/{name}",timeout=90)
                  if r.ok and r.content: data=r.content
              except Exception: pass
              if data is None:
                  page=s.get(f"https://play.google.com/store/apps/details?id={package}&hl=en",timeout=90)
                  m=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',page.text,re.I) or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',page.text,re.I)
                  if m: data=s.get(m.group(1).replace("&amp;","&"),timeout=90).content
              if not data: raise RuntimeError(f"No image source: {name}")
              im=Image.open(BytesIO(data)); im.load()
              im=im.convert("RGBA") if im.mode not in ("RGB","RGBA") else im
              im.save(out/f"{name}.png",format="PNG",optimize=False)
              print(name, im.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: game-images-batch3
          path: batch3

  commit:
    needs: [batch1,batch2,batch3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: game-images-batch*
          merge-multiple: true
          path: public/game-images
      - name: Verify and commit
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = ["ludo-club","lords-mobile","magic-chess-gogo","marvel-duel","marvel-mystic-mayhem","marvel-rivals","mirage-perfect-skyline","mobile-legends","modern-strike-online","mongil-star-dive","my-singing-monsters","onmyoji-arena","oxide-survival-island","overmortal-idle-global","project-entropy","pubg-mobile","roblox","rise-of-kingdoms","stormshot","stumble-guys","super-sus","top-war","whiteout-survival","yalla-ludo"]
          for n in names:
              p=Path("public/game-images")/(n+".png")
              assert p.is_file() and p.stat().st_size>0, n
              with Image.open(p) as im:
                  assert im.format=="PNG" and im.width>0 and im.height>0, n
          print("Verified all 24 images.")
          PY
          git config user.name "Nabd-Store-ON"
          git config user.email "1ahmad3asl@gmail.com"
          git add public/game-images
          git commit -m "Migrate remaining game images in three batches"
          git push origin main
