name: Complete missing game images in GitHub

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-missing-game-images.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and validate only missing images
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY
          import html
          import os
          import re
          import sys
          import tempfile
          import urllib.parse
          import urllib.request

          games = {
              "cloud-song": ("vng.game.sky.fantasy.song.sea", "Cloud Song: Saga of Skywalkers"),
              "king-shot": ("com.fingerfun.kingshot", "King Shot"),
              "zepeto": ("com.naver.zepeto", "ZEPETO"),
              "ghost-story-love-destiny": ("com.netease.wxzcglobal", "Ghost Story: Love Destiny"),
              "golden-spatula": ("com.tencent.tmgp.sgame", "Golden Spatula"),
              "arknights-endfield": ("com.hypergryph.endfield", "Arknights: Endfield"),
              "heaven-burns-red": ("com.heavenburnsred.global", "Heaven Burns Red"),
              "top-war": ("com.Topwar.gp", "Top War: Battle Game"),
              "the-ants": ("com.allstarunion.ta", "The Ants: Underground Kingdom"),
              "cyber-fantasy": ("com.hkfancygame.kog.android", "Cyber Fantasy"),
              "blade-x": ("com.yjmgames.bladex.aos", "Blade X: Odyssey of Heroes"),
              "hyper-front": ("com.battlefun.c1game.na", "Hyper Front"),
              "clash-of-plants": ("com.waterwish.garden.tales.clash.of.plants", "Garden Tales: Clash of Plants"),
              "journey-renewed": ("com.xiyou.cyhk.gp", "Journey Renewed: Fate Fantasy"),
              "dragon-nest-m-sea": ("com.sdg.dragonnest", "Dragon Nest M"),
              "dream-and-lethe-record": ("com.kingsgroup.dreamandlethe", "Dream and Lethe Record"),
              "echocalypse-scarlet-covenant": ("com.gaea.echocalypse.en", "Echocalypse: Scarlet Covenant"),
              "starseed": ("com.com2us.starseedgl.android.google.global.normal", "STARSEED: Asnia Trigger"),
              "extraordinary-ones": ("com.netease.frxyna", "Extraordinary Ones"),
              "marvel-mystic-mayhem": ("com.netease.mmm", "Marvel Mystic Mayhem"),
              "garena-speed-drifters": ("com.garena.game.drift", "Garena Speed Drifters"),
              "mongil-star-dive": ("com.cjenm.mongil", "Mongil: Star Dive"),
              "modern-strike-online": ("com.gamedevlab.modernstrike", "Modern Strike Online"),
              "overmortal-idle-global": ("com.xsupergame.overmortal", "Overmortal: Idle Global"),
              "stormshot": ("com.funplus.ss", "Stormshot"),
              "army-dudes": ("", "Army Dudes"),
              "crystalfall": ("", "CrystalFall"),
          }

          fallback_pages = {
              "cloud-song": "https://apkpure.net/cloud-song-saga-of-skywalkers/vng.game.sky.fantasy.song.sea",
              "king-shot": "https://kingshot.en.uptodown.com/android",
              "zepeto": "https://play.google.com/store/apps/details?id=me.zepeto.main&hl=en&gl=US",
              "ghost-story-love-destiny": "https://play.google.com/store/apps/details?id=com.vnggames.ghoststory&hl=en&gl=US",
              "golden-spatula": "https://play.google.com/store/apps/details?id=com.riot.FFGSSea&hl=en&gl=US",
              "arknights-endfield": "https://play.google.com/store/apps/details?id=com.gryphline.endfield.gp&hl=en&gl=US",
              "heaven-burns-red": "https://play.google.com/store/apps/details?id=com.YoStarEN.HBR&hl=en&gl=US",
              "top-war": "https://play.google.com/store/apps/details?id=com.topwar.gp&hl=en&gl=US",
              "the-ants": "https://play.google.com/store/apps/details?id=com.star.union.planetant&hl=en&gl=US",
              "cyber-fantasy": "https://apkpure.net/astral-guardians-cyber-fantasy/com.hkfancygame.kog.android",
              "blade-x": "https://apkpure.net/blade-x-odyssey-of-heroes/com.yjmgames.bladex.aos",
              "hyper-front": "https://apkpure.net/hyper-front/com.netease.bfc1game.na",
              "clash-of-plants": "https://myandroid.org/apps/com-waterwish-garden-tales-clash-of-plants",
              "journey-renewed": "https://apkpure.net/journey-renewed-fate-fantasy/com.xiyou.cyhk.gp",
              "dragon-nest-m-sea": "https://apkpure.net/dragon-nest-m/com.sdg.dragonnest",
              "dream-and-lethe-record": "https://apkpure.net/dream-and-lethe-record/com.kingsgroup.dreamandlethe",
              "echocalypse-scarlet-covenant": "https://apkpure.net/echocalypse-scarlet-covenant/com.gaea.echocalypse.en",
              "starseed": "https://apkpure.net/starseed-asnia-trigger/com.com2us.starseedgl.android.google.global.normal",
              "extraordinary-ones": "https://apkpure.net/extraordinary-ones/com.netease.frxyna",
              "marvel-mystic-mayhem": "https://apkpure.net/marvel-mystic-mayhem/com.netease.mmm",
              "garena-speed-drifters": "https://play.google.com/store/apps/details?id=com.garena.game.fctw&hl=en&gl=US",
              "mongil-star-dive": "https://play.google.com/store/apps/details?id=com.netmarble.monster2&hl=en&gl=US",
              "modern-strike-online": "https://play.google.com/store/apps/details?id=com.gamedevltd.modernstrike&hl=en&gl=US",
              "overmortal-idle-global": "https://apkpure.net/overmortal-idle-global/com.xsupergame.overmortal",
              "stormshot": "https://play.google.com/store/apps/details?id=com.sivona.stormshot.e&hl=en&gl=US",
              "army-dudes": "https://www.kongregate.com/en/games/skylerfunnydude/army-dudes-full-game",
              "crystalfall": "https://crystalfall.playpark.com/",
          }

          root = "public/game-images"
          os.makedirs(root, exist_ok=True)
          ua = "Mozilla/5.0 (compatible; Nabd-Store image migration/1.0)"
          downloaded = []

          for key, (app_id, label) in games.items():
              existing = []
              for ext in ("png", "jpg", "jpeg", "webp"):
                  p = os.path.join(root, key + "." + ext)
                  if os.path.isfile(p) and os.path.getsize(p) > 1000:
                      existing.append(p)
              if existing:
                  print("SKIP existing:", key)
                  continue

              page_url = fallback_pages.get(key) if not app_id else "https://play.google.com/store/apps/details?id=" + urllib.parse.quote(app_id) + "&hl=en&gl=US"
              req = urllib.request.Request(
                  page_url,
                  headers={"User-Agent": ua, "Accept-Language": "en-US,en;q=0.9"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      page = response.read().decode("utf-8", "ignore")
              except urllib.error.HTTPError as exc:
                  if exc.code != 404 or key not in fallback_pages:
                      raise
                  fallback_url = fallback_pages[key]
                  print("Using verified fallback source:", label, "->", fallback_url)
                  fallback_req = urllib.request.Request(
                      fallback_url,
                      headers={"User-Agent": ua, "Accept-Language": "en-US,en;q=0.9"}
                  )
                  with urllib.request.urlopen(fallback_req, timeout=45) as response:
                      page = response.read().decode("utf-8", "ignore")

              patterns = [
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
                  r'<meta[^>]+property=["\']twitter:image["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']twitter:image["\']'
              ]
              candidates = []
              for pattern in patterns:
                  candidates.extend(re.findall(pattern, page, re.I))
              if not candidates:
                  raise RuntimeError("No official Google Play og:image found for " + label + " (" + app_id + ")")

              image_url = html.unescape(candidates[0]).replace("\\u0026", "&")
              image_req = urllib.request.Request(image_url, headers={"User-Agent": ua})
              with urllib.request.urlopen(image_req, timeout=45) as response:
                  data = response.read()
                  mime = (response.headers.get("Content-Type") or "").split(";")[0].lower()

              if len(data) < 1000 or len(data) > 5 * 1024 * 1024:
                  raise RuntimeError("Invalid image size for " + label + ": " + str(len(data)))

              ext = {"image/jpeg": "jpg", "image/webp": "webp", "image/png": "png"}.get(mime)
              if not ext:
                  raise RuntimeError("Unsupported image type for " + label + ": " + mime)

              final_path = os.path.join(root, key + "." + ext)
              fd, temp_path = tempfile.mkstemp(prefix=key + ".", suffix=".pending." + ext, dir=root)
              os.close(fd)
              with open(temp_path, "wb") as f:
                  f.write(data)
              downloaded.append((temp_path, final_path, label, len(data)))
              print("DOWNLOADED:", label, "->", final_path, len(data), "bytes")

          if not downloaded:
              print("No missing images needed migration.")
              sys.exit(0)

          # Validate every downloaded file before publishing any of them.
          from PIL import Image
          for temp_path, final_path, label, size in downloaded:
              with Image.open(temp_path) as im:
                  im.verify()

          # Publish only after every requested image downloaded and validated successfully.
          if len(downloaded) != len(games):
              raise RuntimeError("Not all missing game images were downloaded.")
          for temp_path, final_path, label, size in downloaded:
              os.replace(temp_path, final_path)

          print("Successfully prepared", len(downloaded), "new GitHub game images.")
          PY

      - name: Commit only the completed GitHub image set
        run: |
          set -euo pipefail
          git config user.name "Nabd-Store-ON"
          git config user.email "1ahmad3asl@gmail.com"
          git add public/game-images
          if git diff --cached --quiet; then
            echo "No image changes required."
            exit 0
          fi
          git commit -m "Complete missing game images in GitHub"
          git push origin main
