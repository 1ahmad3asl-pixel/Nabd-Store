name: Migrate product images from Neon - 3 batches (strict)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-neon-product-images.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_HOST: https://nabd-store.onrender.com/api/game-images-neon

jobs:
  batch1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy exact Neon image bytes
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow requests
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib, os, requests
          from PIL import Image
          items = [
  "yalla-ludo",
  "pubg-mobile",
  "roblox",
  "jawaker",
  "free-fire",
  "clash-of-clans",
  "dragonheir-silent-gods",
  "cloud-song",
  "lords-mobile",
  "8-ball-pool",
  "guns-of-glory",
  "gangs-of-glory",
  "project-entropy",
  "farlight-84",
  "city-of-crime-gang-war",
  "marvel-rivals",
  "genshin-impact",
  "super-sus",
  "crystal-of-atlan",
  "bullet-echo",
  "stumble-guys",
  "honkai-star-rail",
  "mobile-legends",
  "oxide-survival-island",
  "king-shot",
  "zepeto",
  "blood-strike",
  "acecraft",
  "age-of-empires-mobile",
  "nikke",
  "division-resurgence",
  "arena-breakout"
]
          out=Path("batch"); out.mkdir()
          s=requests.Session(); s.headers.update({"User-Agent":"Nabd-Store-Neon-Migration/1.0"})
          for name in items:
              try:
                  r=s.get(f"{os.environ['IMAGE_HOST']}/{name}",timeout=120)
              except Exception as e:
                  print(f"ERROR {name}: {e}"); continue
              if r.status_code == 404:
                  print(f"NEON_MISSING {name}"); continue
              r.raise_for_status()
              if r.headers.get("X-Nabd-Image-Source") != "neon-game-images":
                  raise RuntimeError(f"Refusing non-Neon source for {name}")
              mime=r.headers.get("Content-Type","").split(";")[0].strip().lower()
              ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/avif":"avif","image/svg+xml":"svg"}.get(mime)
              if not ext: raise RuntimeError(f"Unsupported MIME for {name}: {mime}")
              data=r.content
              if not data: raise RuntimeError(f"Empty Neon image: {name}")
              p=out/(name+"."+ext); p.write_bytes(data)
              if ext != "svg":
                  with Image.open(BytesIO(data)) as im: im.verify()
              print(f"NEON_OK {name} {mime} {len(data)} sha256={hashlib.sha256(data).hexdigest()}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neon-game-images-batch1
          path: batch
