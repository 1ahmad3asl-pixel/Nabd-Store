          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neon-game-images-batch3
          path: batch
  commit:
    needs: [batch1,batch2,batch3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: neon-game-images-batch*
          merge-multiple: true
          path: neon-batches
      - name: Install tools
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Install exact Neon images without unnecessary rewrites
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          root=Path("public/game-images"); root.mkdir(parents=True,exist_ok=True)
          src=Path("neon-batches")
          exts=["png","jpg","jpeg","webp","gif","avif","svg"]
          changed=False
          for p in sorted(src.glob("*.*")):
              key=p.stem
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              same=None
              for ext in exts:
                  q=root/(key+"."+ext)
                  if q.is_file() and hashlib.sha256(q.read_bytes()).hexdigest()==digest:
                      same=q; break
              if same:
                  print("UNCHANGED", same); continue
              for ext in exts:
                  q=root/(key+"."+ext)
                  if q.exists(): q.unlink()
              dest=root/p.name; shutil.copy2(p,dest)
              print("UPDATED",dest); changed=True
          manifest={}
          for key in ["yalla-ludo","pubg-mobile","roblox","jawaker","free-fire","clash-of-clans","dragonheir-silent-gods","cloud-song","lords-mobile","8-ball-pool","guns-of-glory","gangs-of-glory","project-entropy","farlight-84","city-of-crime-gang-war","marvel-rivals","genshin-impact","super-sus","crystal-of-atlan","bullet-echo","stumble-guys","honkai-star-rail","mobile-legends","oxide-survival-island","king-shot","zepeto","blood-strike","acecraft","age-of-empires-mobile","nikke","division-resurgence","arena-breakout","ludo-club","afk-journey","age-of-magic","ghost-story-love-destiny","arena-of-valor","growtopia","golden-spatula","hatsune-miku-colorful-stage","arknights-endfield","haikyu-fly-high","ballistic-hero-vng","heaven-burns-red","rise-of-kingdoms","top-war","the-ants","kingdom-guard","call-of-dragons","astral-guardians","cyber-fantasy","blockman-go","blade-x","be-the-king","captain-tsubasa","idol-party","hyper-front","infinite-lagrange","clash-of-plants","journey-renewed","civilization-eras-allies","kuroko-street-rivals","kings-choice-sea","crossfire-legend","legend-of-the-phoenix","legacy-of-discord","army-dudes","crystalfall","crossout-mobile","dragon-raja-sea","dragon-nest-m-sea","life-makeover-global","love-nikki","dream-and-lethe-record","eggy-party","echocalypse-scarlet-covenant","hero-clash","devil-may-cry","my-singing-monsters","dynasty-heroes","starseed","magic-chess-gogo","enhypen-world","marvel-duel","extraordinary-ones","eve-echoes","mirage-perfect-skyline","football-master-2","marvel-mystic-mayhem","garena-speed-drifters","mongil-star-dive","modern-strike-online","overmortal-idle-global","onmyoji-arena","stormshot","whiteout-survival"]:
              found=None
              for ext in exts:
                  q=root/(key+"."+ext)
                  if q.is_file(): found=q.name; break
              if found: manifest[key]=found
          (root/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("Manifest entries:",len(manifest))
          print("Changed:",changed)
          PY
          git config user.name "Nabd-Store-ON"
          git config user.email "1ahmad3asl@gmail.com"
          git add public/game-images
          if git diff --cached --quiet; then echo "No GitHub image changes required."; exit 0; fi
          git commit -m "Copy product images exactly from Neon in three batches"
          git push origin main
